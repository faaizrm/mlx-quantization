[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-quantization"
version = "0.1.0"
description = "Measured mixed-precision quantization on Apple Silicon"
requires-python = ">=3.12"
dependencies = [
  "mlx==0.32.3", "mlx-lm==0.32.0", "datasets==5.1.0",
  "transformers==5.19.0", "huggingface-hub==1.33.0",
  "numpy==2.5.3", "matplotlib==3.11.2", "psutil==7.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
